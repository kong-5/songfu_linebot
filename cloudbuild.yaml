# 推送到 Git 後由 Cloud Build 建置映像並部署到 Cloud Run
#
# 環境變數（DATABASE_URL、LINE_CHANNEL_ACCESS_TOKEN、LINE_CHANNEL_SECRET、
# GOOGLE_CLOUD_VISION_API_KEY、GOOGLE_GEMINI_API_KEY 等）一律在 Cloud Run 服務的
# 「變數與密碼」分頁設定一次；本檔案不傳任何 --update-env-vars / --set-env-vars，
# 部署時 Cloud Run 會自動保留現有環境變數。
#
# （歷史教訓：之前用空字串替換變數覆寫 LINE_CHANNEL_ACCESS_TOKEN 等三個值，
#  導致 LINE webhook 簽章驗證直接失敗、Vision OCR 無法呼叫，整個 bot 崩潰。）

steps:
  # [gate 2026-07-14] 建 image 前先跑核心不變式測試（test/*.test.js，零外部依賴、秒級）：
  # 測試紅＝整個 build 失敗、不部署，壞版本擋在上線前。
  # [gate 2026-07-27] 加 npm run lint（eslint 正確性規則：no-undef/no-dupe-keys 等，~4 秒）：
  # dist/ 直接手改 JS 沒有編譯期檢查，打錯變數名要到執行期才爆——lint 紅＝不部署。
  - name: "node:20-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm ci --no-audit --no-fund
        npm run lint
        npm test
  # [smoke 2026-07-14] PG 冒煙：對臨時 postgres 容器跑 initPg 全套遷移＋核心查詢，
  # 攔「本機 SQLite 全綠、雲端 PG 才壞」的整類回歸（歷史案例：42804 型別錯誤）。
  # [gate 2026-07-27] 已轉硬閘門：本機對 postgres:16 連跑三次皆 6/6 綠且完全冪等後拿掉 report-only，
  # 冒煙紅＝整個 build 失敗、不部署。若哪天因 postgres image 拉不到之類的環境問題卡住，
  # 是改「起容器」那一步（下方已加 pg_isready 等待），不要把這裡的閘門改回 || echo。
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker run -d --name pgsmoke --network cloudbuild \
          -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke postgres:16-alpine
        # 等 PG 就緒（最多 60 秒）；起不來就讓這一步失敗，而不是留給冒煙步驟報「連不上」的模糊錯誤
        for i in $(seq 1 30); do
          docker exec pgsmoke pg_isready -U postgres -d smoke >/dev/null 2>&1 && echo "PG 就緒" && exit 0
          sleep 2
        done
        echo "❌ postgres 容器 60 秒內未就緒"; docker logs pgsmoke | tail -20; exit 1
  - name: "node:20-slim"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        npm ci --no-audit --no-fund
        DATABASE_URL="postgres://postgres:smoke@pgsmoke:5432/smoke" npm run smoke:pg
  # 先把上次 build 的映像當 layer 快取拉下來；首次或拉不到都不阻擋（|| true）
  # [trace 2026-07-14] 同時打 $SHORT_SHA 標籤：latest 之外留每個版本的映像，回滾/追溯有據。
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${SHORT_SHA} \
          .
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:latest
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${SHORT_SHA}
  # [canary 2026-07-29 §五F1] 兩段式部署（第 1 段）：新修訂版本先「不導流」上線，只掛 candidate 標籤。
  # 舊版本仍吃 100% 流量——這一步失敗或下一步健檢不過，線上完全沒受影響（過去是先導流再健檢，
  # 壞版本已經在服務客戶了，註解自己也寫「需手動回滾」）。
  #
  # [invariant 2026-07-29 §五F2] --max-instances=1 明確寫進部署指令：
  # 本系統 LINE 收單狀態機（collectingByGroup 記憶體 session）、告警去重、登入節流都在記憶體，
  # 單實例是**不變式**。過去這個值只存在 Console，誰誤改都不會有徵兆。這裡釘住＝每次部署都會校正回 1。
  # 執行期另有 dist/lib/instance-guard.js 偵測多實例並推 LINE 告警（雙保險）。
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_IMAGE}:${SHORT_SHA}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--add-cloudsql-instances"
      - "${_INSTANCE}"
      - "--max-instances"
      - "1"
      - "--no-traffic"
      - "--tag"
      - "candidate"
  # [canary 2026-07-29 §五F1] 第 2 段：對「candidate 專屬網址」健檢（不是服務主網址——那還是舊版）。
  # /health 回 200 含 dbReady 才算過；重試 6 次 × 10 秒涵蓋冷啟動。
  # 不過＝build 紅、**流量仍留在舊版**，線上不受影響，修好再推即可。
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # 用 JSON + python3 取 candidate 標籤的專屬網址（比 --format 投影過濾器好讀也好除錯）
        gcloud run services describe ${_SERVICE} --region ${_REGION} --format=json > /workspace/svc.json
        CAND=$$(python3 -c "import json;d=json.load(open('/workspace/svc.json'));print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='candidate'),''))")
        if [ -z "$$CAND" ]; then
          echo "❌ 取不到 candidate 標籤網址，無法健檢新版"; exit 1
        fi
        echo "金絲雀健康檢查（新版尚未導流）：$$CAND/health"
        for i in 1 2 3 4 5 6; do
          if curl -fsS --max-time 10 "$$CAND/health"; then echo; echo "✅ 新版 /health OK"; exit 0; fi
          echo "…第 $$i 次未過，10 秒後重試"; sleep 10
        done
        echo "❌ 新版 /health 連續 6 次失敗——流量仍在舊版（線上未受影響）。"
        echo "   請看 Cloud Run 該修訂版本的記錄檔（多半是 DB 未就緒／遷移失敗），修好再推。"
        exit 1
  # [canary 2026-07-29 §五F1] 第 3 段：健檢過了才把流量導到新修訂版本（100%）。
  # 導流後再對主網址確認一次，確保使用者實際打到的就是健康的新版。
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        # 取 candidate 標籤實際指到的修訂版本名（不自己拼名字：同一個 commit 重跑 build 時
        # --revision-suffix 會撞名，交給 Cloud Run 自動命名再讀回來最穩）
        gcloud run services describe ${_SERVICE} --region ${_REGION} --format=json > /workspace/svc2.json
        REV=$$(python3 -c "import json;d=json.load(open('/workspace/svc2.json'));print(next((t.get('revisionName','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='candidate'),''))")
        if [ -z "$$REV" ]; then
          echo "❌ 取不到 candidate 修訂版本名，不導流（流量仍在舊版）"; exit 1
        fi
        echo "健檢通過，導流 100% 到 $$REV"
        gcloud run services update-traffic ${_SERVICE} --region ${_REGION} --to-revisions "$$REV=100"
        URL=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} --format='value(status.url)')
        for i in 1 2 3; do
          if curl -fsS --max-time 10 "$$URL/health"; then echo; echo "✅ 導流後主網址 /health OK"; exit 0; fi
          echo "…第 $$i 次未過，10 秒後重試"; sleep 10
        done
        echo "❌ 導流後主網址健檢失敗，請至 Cloud Run 回滾到前一個修訂版本"
        exit 1
# [fix 2026-07-29] 預設 build timeout 只有 10 分鐘，金絲雀多了「健檢＋導流」兩步（各含重試等待），
# 撞到上限會在「已上線候選但還沒導流」的半途被砍掉。拉到 30 分鐘。
timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: asia-east1
  _REPO: linebot
  _IMAGE: linebot
  _SERVICE: songfu-line-bot
  _INSTANCE: handy-implement-457807-u0:asia-east1:songfu-line-bot
